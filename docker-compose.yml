services:
  api-server:
    build:
      context: .
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    image: ${DOCKER_REG_ORG}/${DOCKER_IMG_NAME}:${DOKCER_IMG_TAG}
    ports:
      - ${API_SERVER_HOST_PORT}:${API_SERVER_PORT}
    env_file:
      - .env
    environment:
      - ENV=${ENV}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAME=${DATABASE_SCHEMA}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    restart: always