name: REST API Sever CI/CD

on:
  push:
    branches:
      - main    # 운영
      - release # 스테이징
      - develop # 개발

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # 환경별 변수 적용 (prod, stage, dev)
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'release' && 'stage' || github.ref_name == 'develop' && 'dev' }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v5
      
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ vars.DOCKER_REG_ORG }}/${{ vars.API_SERVER_IMG_NAME }}:${{ vars.API_SERVER_IMG_TAG }} .
          docker push ${{ vars.DOCKER_REG_ORG }}/${{ vars.API_SERVER_IMG_NAME }}:${{ vars.API_SERVER_IMG_TAG }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'release' && 'stage' || github.ref_name == 'develop' && 'dev' }}
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v5
      
      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-ssh-private-key.pem
          chmod 600 ~/.ssh/ec2-ssh-private-key.pem
          ssh-keyscan -H ${{ secrets.EC2_SERVER_HOST }} >> ~/.ssh/known_hosts

      # 1. .env 파일 생성
      # docker-compose가 참조할 환경변수들을 여기서 파일로 만들어줌
      - name: Create .env file
        run: |
          cat <<EOF > .env
          # 기본 설정
          ENV=${{ vars.ENV }}
          
          # 이미지 정보
          DOCKER_REG_ORG=${{ vars.DOCKER_REG_ORG }}
          API_SERVER_IMG_NAME=${{ vars.API_SERVER_IMG_NAME }}
          API_SERVER_IMG_TAG=${{ vars.API_SERVER_IMG_TAG }}
          
          # 포트
          API_SERVER_HOST_PORT=${{ vars.API_SERVER_HOST_PORT }}
          API_SERVER_PORT=${{ vars.API_SERVER_PORT }}
          
          # DB 연결 (Secrets)
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=${{ secrets.DATABASE_PORT }}
          DATABASE_SCHEMA=${{ secrets.DATABASE_SCHEMA }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          
          # AWS S3 (Secrets)
          AWS_S3_BUCKET_NAME=${{ vars.AWS_S3_BUCKET_NAME }}
          AWS_S3_REGION=${{ vars.AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
          # 기타
          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
          EOF

      # 2. 파일 서버로 전송 (compose 파일이랑 방금 만든 .env 같이 보냄)
      - name: Copy files to EC2
        run: |
          ssh -i ~/.ssh/ec2-ssh-private-key.pem ${{ vars.EC2_SERVER_USER }}@${{ secrets.EC2_SERVER_HOST }} "mkdir -p /home/${{ vars.EC2_SERVER_USER }}/app/web-server"
          scp -i ~/.ssh/ec2-ssh-private-key.pem docker-compose.yml .env ${{ vars.EC2_SERVER_USER  }}@${{ secrets.EC2_SERVER_HOST }}:/home/${{ vars.EC2_SERVER_USER }}/app/web-server/

      - name: Check if Docker is installed
        id: check-docker
        run: |
          DOCKER_EXISTS=$(ssh -i ~/.ssh/ec2-ssh-private-key.pem -o StrictHostKeyChecking=no ${{ vars.EC2_SERVER_USER }}@${{ secrets.EC2_SERVER_HOST }} 'command -v docker >/dev/null && echo "true" || echo "false"')
          echo "docker_exists=$DOCKER_EXISTS" >> $GITHUB_OUTPUT

      - name: Install Docker on EC2
        if: steps.check-docker.outputs.docker_exists == 'false'
        run: |
          ssh -i ~/.ssh/ec2-ssh-private-key.pem -o StrictHostKeyChecking=no ${{ vars.EC2_SERVER_USER }}@${{ secrets.EC2_SERVER_HOST }} << 'EOF'
              sudo apt-get update
              sudo apt-get install -y \
                  ca-certificates \
                  curl \
                  gnupg \
                  lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo usermod -aG docker $USER
          EOF

      # 3. 배포 실행 (이미 파일 다 있으니까 up만 하면 됨)
      - name: Deploy to EC2 via Docker Compose
        run: |
          ssh -i ~/.ssh/ec2-ssh-private-key.pem -o StrictHostKeyChecking=no ${{ vars.EC2_SERVER_USER }}@${{ secrets.EC2_SERVER_HOST }} << EOF
              cd ~/app/web-server
              docker compose down
              docker compose pull
              docker compose up -d
              docker image prune -f
          EOF

# [설정 가이드]
# 깃헙 레포 Settings > Secrets and variables > Actions 에 아래 값들 등록해주면 됨
#
# 1. Secrets (보안 필요한거)
# - DOCKER_TOKEN, EC2_SSH_PRIVATE_KEY
# - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# - DATABASE_HOST, DATABASE_PORT, DATABASE_SCHEMA, DATABASE_USER, DATABASE_PASSWORD
# - EC2_SERVER_HOST
#
# 2. Variables (환경별로 다를 수 있는거 - dev/prod 등)
# - ENV (local, dev, prod)
# - DOCKER_USER_NAME, DOCKER_REG_ORG
# - API_SERVER_IMG_NAME, API_SERVER_IMG_TAG
# - API_SERVER_HOST_PORT, API_SERVER_PORT
# - AWS_S3_BUCKET_NAME, AWS_S3_REGION
# - CORS_ORIGINS
# - EC2_SERVER_USER
